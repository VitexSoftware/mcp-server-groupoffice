[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groupoffice-mcp-server"
version = "0.1.0"
description = "MCP Server for GroupOffice groupware integration (JMAP-style API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CyberVitexus", email = "info@vitexsoftware.cz" }
]
keywords = ["mcp", "groupoffice", "model-context-protocol", "jmap", "groupware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "fastmcp>=4.0.0b1",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.0.291",
]

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcp-server-groupoffice"
Repository = "https://github.com/VitexSoftware/mcp-server-groupoffice"

[project.scripts]
groupoffice-mcp-server = "groupoffice_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
