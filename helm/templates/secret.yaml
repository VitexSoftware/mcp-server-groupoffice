apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "mcp-server-groupoffice.fullname" . }}
  labels:
    {{- include "mcp-server-groupoffice.labels" . | nindent 4 }}
stringData:
  GROUPOFFICE_API_TOKEN: {{ required "secrets.GROUPOFFICE_API_TOKEN is required - set it via --set or a values file kept out of version control" .Values.secrets.GROUPOFFICE_API_TOKEN | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{- if ne $key "GROUPOFFICE_API_TOKEN" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
