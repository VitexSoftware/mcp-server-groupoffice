replicaCount: 1

image:
  repository: docker.io/vitexsoftware/mcp-server-groupoffice
  tag: "0.2.0"
  pullPolicy: IfNotPresent

podLabels: {}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # This server never talks to the Kubernetes API, so it has no need for a
  # mounted token - leave this false unless something else requires it.
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The server speaks MCP over stdio, not HTTP - there is no Service/port to
# expose. This chart keeps a pod alive so an MCP client can reach it via
# `kubectl exec -i` (see templates/NOTES.txt).
environment:
  GROUPOFFICE_URL: "https://groupoffice.example.com"
  GROUPOFFICE_READONLY: "true"
  GROUPOFFICE_VERIFY_SSL: "true"
  GROUPOFFICE_TIMEOUT: "30"
  GROUPOFFICE_MAX_RETRIES: "3"
  GROUPOFFICE_DEBUG: "false"

# No default on purpose: the chart refuses to install (see
# templates/secret.yaml) unless this is overridden with a real token, e.g.
# --set secrets.GROUPOFFICE_API_TOKEN=... or a values file kept out of
# version control - a placeholder default here would deploy silently with a
# credential that looks valid but isn't.
secrets:
  GROUPOFFICE_API_TOKEN: ""

command:
  enabled: true
  value:
    - /bin/sh
    - -c
    - while true; do sleep 3600; done

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
